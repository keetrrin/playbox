{% load static %}<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayBox</title><link rel="stylesheet" href="{% static 'games/style.css' %}"></head>
<body><header><a class="logo" href="{% url 'home' %}">PlayBox</a><nav>
{% if user.is_authenticated %}<a href="{% url 'friends' %}">Друзья</a><a href="{% url 'shop' %}">Магазин</a><a href="{% url 'profile' %}">👤 {{ user.username }}</a>
{% if user.is_staff %}<a href="/admin/">Админка</a>{% endif %}
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Выйти</button></form>
{% else %}<a href="{% url 'login' %}">Вход</a><a href="{% url 'register' %}">Регистрация</a>{% endif %}
</nav></header><main>
<div id="toasts"></div>
{% block content %}{% endblock %}</main><script>
function fs(id){const e=document.getElementById(id);if(e.classList.contains('fs'))return fsx(e);e.classList.add('fs');document.body.style.overflow='hidden';
 const b=document.createElement('button');b.className='fsx';b.textContent='Закрыть ✕';b.onclick=()=>fsx(e);e.append(b);if(e.requestFullscreen)e.requestFullscreen().catch(()=>{})}
function fsx(e){e.classList.remove('fs');document.body.style.overflow='';const x=e.querySelector('.fsx');x&&x.remove();if(document.fullscreenElement)document.exitFullscreen()}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){const e=document.querySelector('.play.fs');e&&fsx(e)}});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'){const e=document.querySelector('.play.fs');e&&fsx(e)}});
function toast(t,k){k=k||'info';const d=document.createElement('div');d.className='toast '+k;d.innerHTML='<span class="ti">'+({success:'✓',error:'!',info:'i'}[k]||'i')+'</span><span></span>';d.lastChild.textContent=t;document.getElementById('toasts').append(d);setTimeout(()=>d.classList.add('out'),3500);setTimeout(()=>d.remove(),4000)}
{% for m in messages %}toast("{{ m|escapejs }}","{{ m.tags|escapejs }}");{% endfor %}
if(sessionStorage.pt){toast(sessionStorage.pt,'success');sessionStorage.removeItem('pt')}
</script></body></html>
