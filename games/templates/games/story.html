  const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*60;p[i*3+1]=Math.random()*30;p[i*3+2]=(Math.random()-.5)*40}

 cave(){scene.background=new T.Color(0x07080c);scene.fog=new T.Fog(0x07080c,6,42);B(60,.4,60,0x2a2622,0,-.2,0);for(let i=0;i<26;i++){const a=i/26*6.28,r=14+Math.random()*3;S2(2+Math.random()*2.5,0x3a3a40,Math.cos(a)*r,2,Math.sin(a)*r-4)}

const fig=(col,o)=>{const g=new T.Group();o=o||{};const P=(geo,c,x,y,z)=>{const q=new T.Mesh(geo,new T.MeshStandardMaterial({color:c,roughness:.7}));q.position.set(x,y,z);q.castShadow=true;g.add(q);return q};
  P(new T.CylinderGeometry(.35,.45,1.1,12),col,0,1.05,0);P(new T.SphereGeometry(.3,16,12),0xf0c8a0,0,1.85,0);[-.15,.15].forEach(x=>P(new T.CylinderGeometry(.12,.12,.8,8),0x2b2b2b,x,.4,0));[-.5,.5].forEach(x=>P(new T.CylinderGeometry(.09,.09,.8,8),col,x,1.1,0));
  if(o.hat)P(new T.ConeGeometry(.42,.35,3),o.hat,0,2.2,0);if(o.beard)P(new T.SphereGeometry(.2,10,8),0x5a3b1e,0,1.65,.18);if(o.crutch)P(new T.CylinderGeometry(.04,.04,1.6,6),0x6b4a2a,.65,.8,0);if(o.parrot)P(new T.SphereGeometry(.14,10,8),0x2ecc71,-.4,2.1,0);return g};

function build(node,players){grp.traverse(o=>{if(o.geometry)o.geometry.dispose()});scene.remove(grp);grp=new T.Group();scene.add(grp);FX=[];hemi.intensity=.9;grp.rotation.set(0,0,0);SC[N[node].sc]();

poll();setInterval(poll,1000)}
