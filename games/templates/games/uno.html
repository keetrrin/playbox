{% extends 'games/base.html' %}{% load static %}{% block content %}
<div class="gh"><div class="e">🃏</div><div><h1>UNO 3D</h1><p>Код комнаты: <b>{{ uno.code }}</b> · 2–4 игрока. Нажимайте на карты в руке, колоду — чтобы взять карту.</p></div></div>
<button class="ghost" onclick="navigator.clipboard.writeText(location.href);toast('Ссылка скопирована','success')">Скопировать ссылку</button> <button id="start" style="display:none">Начать / раздать заново</button>
<div class="stage cards" id="tbl"></div><div id="info" class="cinfo"></div>
<div id="wild" style="display:none;gap:10px;margin-top:10px"><button class="uc cR" data-c="R"></button><button class="uc cY" data-c="Y"></button><button class="uc cG" data-c="G"></button><button class="uc cB" data-c="B"></button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="{% static 'games/cards3d.js' %}"></script>
<script>
const csrf="{{ csrf_token }}",S="{% url 'uno_state' uno.code %}",M="{% url 'uno_move' uno.code %}",ST="{% url 'uno_start' uno.code %}";let st=null;
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify(b||{})});
const tbl=CardTable(document.getElementById('tbl'),i=>{if(!st||!st.started||st.winner)return;if(i==='deck')return move({draw:1});const c=st.hand[i];if(c[0]=='K'){const w=document.getElementById('wild');w.style.display='flex';w.querySelectorAll('button').forEach(x=>x.onclick=()=>{w.style.display='none';move({i,color:x.dataset.c})})}else move({i})});
function render(){document.getElementById('start').style.display=(st.host&&(!st.started||st.winner)&&st.players.length>=2)?'':'none';
 const inf=document.getElementById('info');inf.textContent=!st.started?'Ждём игроков ('+st.players.length+'/4): '+st.players.map(p=>p.name).join(', ')+'. '+(st.host?'Нажмите «Начать», когда все в сборе.':'Хозяин начнёт игру.'):(st.winner?'Победил '+st.winner+'!':(st.yourturn?'Ваш ход':'Ходит '+st.turnName))+(st.log?' · '+st.log:'');
 tbl.set({kind:'u',hand:st.started?st.hand.map(c=>({t:'u',c})):[],opp:st.players.filter(p=>!p.you).map(p=>({name:p.name,n:p.n,turn:p.turn})),pile:st.deck||0,top:st.started?{t:'u',c:st.top}:null,ring:st.started?st.color:null,mine:!!st.yourturn})}
async function poll(){try{const d=await (await fetch(S)).json();if(!d.error){st=d;render()}}catch(e){}}
async function move(b){try{const r=await post(M,b),d=await r.json();if(!r.ok)return toast(d.error,'error');st=d;render()}catch(e){toast('Нет связи','error')}}
document.getElementById('start').onclick=async()=>{try{const r=await post(ST),d=await r.json();if(!r.ok)toast(d.error,'error');else{st=d;render()}}catch(e){}};
poll();setInterval(poll,1000);
</script>{% endblock %}
